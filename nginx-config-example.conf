# nginx configuration for WOTA Mapping
# This file provides the nginx configuration needed to serve the application at:
# https://m5tea.uk/wota-mapping/
#
# To use this configuration:
# 1. Copy/merge this into your nginx site configuration (usually in /etc/nginx/sites-available/)
# 2. Update the root path to match your server's actual deployment directory
# 3. Test with: sudo nginx -t
# 4. Reload nginx: sudo systemctl reload nginx

# Static frontend files
location /wota-mapping/ {
    alias /path/to/wota-mapping/;  # Update this to your actual deployment path
    index index.html;
    try_files $uri $uri/ /wota-mapping/index.html;

    # Enable CORS if needed
    add_header Access-Control-Allow-Origin *;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Backend API proxy
location /wota-mapping/api/ {
    proxy_pass http://localhost:3006/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}